<!doctype html>
<!--
Rôle : simulation de la rotation uniforme (activité 3) : équation horaire θ(t) = ω·t + θ0, période et fréquence.
Reçoit : ω et θ0 (curseurs), lancer, mettre en pause, recommencer.
Produit : le disque qui tourne, la courbe θ(t) tracée en direct, l'équation horaire, T, f et s(t).
Utilisé par : le cadre des médias du tableau (ressource « rotation_uniforme » du manifeste).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotation uniforme</title>
  <link rel="stylesheet" href="commun/style.css">
  <script type="module" src="rotation_uniforme.js"></script>
</head>
<body>
  <p class="titre">Rotation uniforme : position angulaire θ en fonction du temps (R = 10 cm)</p>
  <div class="scene"><svg viewBox="0 0 760 400" aria-label="Disque en rotation et courbe θ(t)"></svg></div>
  <p class="mesures" id="mesures" aria-live="polite"></p>
  <div class="commandes">
    <button id="lancer" type="button" aria-pressed="false">Lancer</button>
    <button id="recommencer" type="button">Recommencer</button>
    <label for="omega">ω <input id="omega" type="range" min="0.5" max="6" step="0.1" value="1.5"><output for="omega"></output></label>
    <label for="theta0">θ₀ <input id="theta0" type="range" min="0" max="360" step="15" value="45"><output for="theta0"></output></label>
    <label><input id="voir-equations" type="checkbox"> Équations, T et f</label>
  </div>
</body>
</html>
