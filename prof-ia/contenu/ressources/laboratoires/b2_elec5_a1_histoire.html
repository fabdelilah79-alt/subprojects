:root {
  --main: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --imprime: Georgia, "Times New Roman", serif;
  --interface: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --encre: #1f2a44;
  --stylo-rouge: #b3261e;
  --stylo-vert: #1e6b3a;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #101214;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#ecran {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#etage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1024px;
  height: 640px;
  overflow: hidden;
  transform-origin: 0 0;
  font-family: var(--interface);
}

#labo {
  position: absolute;
  inset: 0;
  width: 1024px;
  height: 640px;
}

.glissable {
  cursor: grab;
}

.souleve {
  cursor: grabbing;
}

.numero-paillasse {
  font: 600 15px var(--interface);
  fill: #7a8077;
  letter-spacing: 0.05em;
}

.pense-bete-titre {
  font: 500 19px var(--main);
  fill: #6b5300;
}

.pense-bete-texte {
  font: 500 22px var(--main);
  fill: var(--encre);
}

.graduation {
  font: 600 9px var(--interface);
  fill: #1d1d1d;
}

.etiquette-objet {
  font: 700 11px var(--interface);
  fill: #3b2a05;
}

.etiquette-carton {
  font: 500 17px var(--main);
  fill: var(--encre);
}

.titre-document {
  font: 700 15px var(--imprime);
  fill: #1d1d1d;
}

.texte-document {
  font: 13px var(--imprime);
  fill: #1d1d1d;
}

.zone-depot {
  fill: none;
  stroke: #f1e08a;
  stroke-width: 2;
  stroke-dasharray: 6 5;
  opacity: 0;
  transition: opacity 0.2s;
}

.zone-depot.active {
  opacity: 0.9;
}

input,
select,
button {
  font-family: inherit;
}

:focus-visible {
  outline: 3px solid #f1b434;
  outline-offset: 2px;
}
</style>
  <style>
/*
Rôle : style de la tablette numérique : cadre noir, écran, barre des applications, tableur et graphique.
Reçoit : rien.
Produit : l'apparence réaliste de la tablette, couchée sur la paillasse ou prise en main.
Utilisé par : la page de chaque simulation (avec labo.css).
*/
.tablette {
  position: absolute;
  width: 640px;
  height: 420px;
  transform-origin: 50% 100%;
  transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 5;
}

.tablette-cadre {
  position: relative;
  height: 100%;
  padding: 16px 30px 16px 18px;
  border-radius: 28px;
  background: linear-gradient(145deg, #3a3e44, #15171a 45%, #0b0c0e);
  box-shadow: 0 0 0 2px #50555c, 0 22px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.25);
  cursor: grab;
}

.tablette.posee .tablette-cadre {
  box-shadow: 0 0 0 2px #50555c, 0 6px 6px rgba(0, 0, 0, 0.6);
  cursor: pointer;
}

.tablette-ecran {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  border-radius: 8px;
  background: #f7f8fa;
  color: #1c2127;
  cursor: default;
}

.tablette.posee .tablette-ecran > * {
  pointer-events: none;
}

.tablette.posee .tablette-ecran {
  filter: brightness(0.75);
}

.tablette-poser {
  position: absolute;
  right: -7px;
  top: 50%;
  width: 44px;
  height: 44px;
  margin-top: -22px;
  border: 0;
  background: none;
  cursor: pointer;
}

.tablette-poser::after {
  content: "";
  position: absolute;
  left: 13px;
  top: 13px;
  width: 16px;
  height: 16px;
  border: 2px solid #6d737b;
  border-radius: 50%;

.tablette-statut {
  display: flex;

  gap: 4px;
  padding: 4px 8px;
  background: #e6e9ee;

.tablette-onglet,

.tablette-onglet[aria-pressed="true"] {

.tablette-heure {

.tablette-app {

.tableur-barre,

  <script>
/*
Rôle : espace de noms commun des laboratoires virtuels (Labo) : création d'éléments, nombres à la française,
       petit bus d'événements, animations.
Reçoit : rien.
Produit : window.Labo avec svg(), texte(), texte_exposants(), html(), nombre(), lire_nombre(), ecouter(), annoncer(), animer().
Utilisé par : tous les fichiers de laboratoires/commun/ et des simulations.
*/
window.Labo = window.Labo || {};

(function (L) {
  const NS = "http://www.w3.org/2000/svg";
  const abonnes = {};

  L.LARGEUR = 1024;
  L.HAUTEUR = 640;

  L.svg = function (nom, attributs = {}, parent = null) {
    // Crée un élément SVG avec ses attributs et l'ajoute au parent s'il est donné.
    const element = document.createElementNS(NS, nom);
    for (const [cle, valeur] of Object.entries(attributs)) element.setAttribute(cle, valeur);
    if (parent) parent.append(element);
    return element;
  };

  L.texte = function (parent, x, y, contenu, attributs = {}) {
    // Écrit un texte SVG (centré par défaut) et le renvoie.
    const t = L.svg("text", { x, y, "text-anchor": "middle", "dominant-baseline": "middle", ...attributs }, parent);
    t.textContent = contenu;
    return t;
  };

  L.texte_exposants = function (parent, x, y, contenu, attributs = {}) {
    // Écrit un texte où « ^{...} » est en exposant et « _{...} » en indice (F_{S/T}, 10^{n+1}).
    const t = L.svg("text", { x, y, "dominant-baseline": "middle", ...attributs }, parent);
    contenu.split(/([\^_]\{[^}]*\})/).forEach((morceau) => {
      const decale = { "^": "super", _: "sub" }[morceau[0]];
      const special = decale && morceau[1] === "{";
      const s = L.svg("tspan", special ? { "baseline-shift": decale, "font-size": "70%" } : {}, t);
      s.textContent = special ? morceau.slice(2, -1) : morceau;
    });
    return t;
  };

  L.html = function (nom, attributs = {}, parent = null, texte = "") {
    // Crée un élément HTML avec ses attributs et son texte, et l'ajoute au parent s'il est donné.
    const element = document.createElement(nom);
    for (const [cle, valeur] of Object.entries(attributs)) element.setAttribute(cle, valeur);
    if (texte) element.textContent = texte;
    if (parent) parent.append(element);
    return element;
  };

  L.ecrire_riche = function (element, texte) {
    // Remplit un élément HTML : « _{...} » devient un indice, « ^{...} » un exposant (F_{S/T}, 10^{8}).
    element.replaceChildren();
    String(texte).split(/([\^_]\{[^}]*\})/).forEach((morceau) => {
      const balise = { "^": "sup", _: "sub" }[morceau[0]];
      if (balise && morceau[1] === "{") L.html(balise, {}, element, morceau.slice(2, -1));
      else if (morceau) element.append(morceau);
    });
    return element;
  };

  L.nombre = function (valeur, decimales = 2) {
    // Écrit un nombre à la française (virgule), avec un nombre de décimales fixé.
    return valeur.toLocaleString("fr-FR", { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
  };

  L.nombre_court = function (v, chiffres = 4) {
    // Écrit un nombre avec quelques chiffres significatifs ; très petit ou très grand : écriture scientifique (2,5E-9).
    if (v === 0 || !Number.isFinite(v)) return String(v).replace(".", ",");
    const a = Math.abs(v);
    if (a < 1e-3 || a >= 1e7) return v.toExponential(chiffres - 1).replace(/\.?0+e/, "e").replace("e+", "E").replace("e", "E").replace(".", ",");
    return Number(v.toPrecision(chiffres)).toLocaleString("fr-FR", { maximumFractionDigits: 10 });
  };

  L.lire_nombre = function (texte) {
    // Lit un nombre écrit par l'élève (virgule ou point ; 1,98E20 ou 1,98×10^20) ; renvoie null sinon.
    const propre = String(texte ?? "").trim().replace(/\s/g, "").replace(",", ".")
      .replace(/^([-+]?\d*\.?\d+)(?:[x×*·]|\.(?=10\^))10\^?\(?([-+]?\d+)\)?$/i, "$1e$2");
    if (propre === "") return null;
    const valeur = Number(propre);
    return Number.isFinite(valeur) ? valeur : null;
  };

  L.proche = function (valeur, cible, tolerance) {
    // Dit si une valeur est assez proche de la cible (tolérance absolue).
    return valeur !== null && Math.abs(valeur - cible) <= tolerance;
  };

  L.ecouter = function (type, fonction) {
    // Abonne une fonction aux annonces d'un type donné.
    (abonnes[type] = abonnes[type] || []).push(fonction);
  };

  L.annoncer = function (type, donnees = {}) {
    // Prévient tous les abonnés d'un type d'annonce.
    for (const fonction of abonnes[type] || []) fonction(donnees);
  };

  L.animer = function (duree_s, image, fin = null) {
    // Appelle image(t) avec t de 0 à 1 pendant duree_s secondes, puis fin() ; renvoie une fonction d'arrêt.
    let debut = null;
    let arrete = false;
    const tourner = (instant) => {
      if (arrete) return;
      if (debut === null) debut = instant;
      const t = Math.min(1, (instant - debut) / (duree_s * 1000));
      image(t);
      if (t < 1) requestAnimationFrame(tourner);
      else if (fin) fin();
    };
    requestAnimationFrame(tourner);
    return () => { arrete = true; };
  };

  L.adoucir = (t) => 1 - Math.pow(1 - t, 3);

  L.chute = function (t) {
    // Courbe d'une chute avec un petit rebond à la fin (t de 0 à 1 -> position de 0 à 1).
    if (t < 0.7) return Math.pow(t / 0.7, 2);
    const r = (t - 0.7) / 0.3;
    return 1 - 0.06 * Math.sin(Math.PI * r) * (1 - r);
  };

  L.placer = function (element, x, y, echelle = 1) {
    // Place un groupe SVG en (x, y), avec une échelle facultative.
    element.setAttribute("transform", `translate(${x} ${y})` + (echelle !== 1 ? ` scale(${echelle})` : ""));
  };
})(window.Labo);
</script>
  <script>
/*
Rôle : matières du laboratoire en 2,5D : dégradés (métal, laiton, verre, eau, bois, paillasse), textures et ombres.
Reçoit : le dessin SVG du laboratoire.
Produit : un bloc <defs> ; chaque matière s'utilise par fill="url(#nom)" ou filter="url(#nom)" ;
         Labo.tige() pour les tiges métalliques (un dégradé ne s'affiche pas sur un trait parfaitement droit).
Utilisé par : toutes les simulations (Labo.materiaux), avant de dessiner.
*/
(function (L) {
  function degrade(defs, id, arrets, x2 = 1, y2 = 0, attributs = {}) {
    // Ajoute un dégradé linéaire ; arrets = [[position, couleur, opacité?], ...].
    const g = L.svg("linearGradient", { id, x1: 0, y1: 0, x2, y2, ...attributs }, defs);
    for (const [position, couleur, opacite = 1] of arrets) {
      L.svg("stop", { offset: position, "stop-color": couleur, "stop-opacity": opacite }, g);
    }
  }

  function filtre_ombre(defs, id, flou, dx, dy, opacite) {
    // Ajoute une ombre portée douce (lumière venant d'en haut à gauche).
    const f = L.svg("filter", { id, x: "-40%", y: "-40%", width: "180%", height: "180%" }, defs);
    L.svg("feDropShadow", { dx, dy, stdDeviation: flou, "flood-color": "#000", "flood-opacity": opacite }, f);
  }

  function texture_points(defs, id, fond, couleur, taille, points) {
    // Ajoute un motif répété fait de petits points (pores de mousse, grain de brique).
    const motif = L.svg("pattern", { id, width: taille, height: taille, patternUnits: "userSpaceOnUse" }, defs);
    L.svg("rect", { width: taille, height: taille, fill: fond }, motif);
    for (const [x, y, r] of points) L.svg("circle", { cx: x, cy: y, r, fill: couleur }, motif);
  }

  function metaux(defs) {
    // Métal chromé, laiton, acier sombre.
    degrade(defs, "metal", [[0, "#6f777d"], [0.3, "#f4f6f7"], [0.55, "#b9c0c5"], [1, "#59616a"]]);
    degrade(defs, "metal-h", [[0, "#f1f3f4"], [0.5, "#aab2b8"], [1, "#5e666d"]], 0, 1);
    degrade(defs, "laiton", [[0, "#7a5512"], [0.28, "#f6dc8c"], [0.55, "#c99a35"], [1, "#6d4a0e"]]);
    degrade(defs, "laiton-haut", [[0, "#fbeab0"], [1, "#c99a35"]], 0, 1);
    degrade(defs, "acier", [[0, "#2c3136"], [0.4, "#5f676e"], [1, "#24282c"]]);
  }

  function verres(defs) {
    // Verre, eau, liquide coloré, plastique transparent.
    degrade(defs, "verre", [[0, "#ffffff", 0.55], [0.12, "#dfeef3", 0.18], [0.8, "#cfe3ea", 0.12], [0.92, "#ffffff", 0.45], [1, "#9fb6be", 0.35]]);
    degrade(defs, "eau", [[0, "#7fc4dc", 0.55], [1, "#2c7fa3", 0.75]], 0, 1);
    degrade(defs, "eau-face", [[0, "#2c7fa3", 0.35], [0.5, "#9fdcef", 0.25], [1, "#2c7fa3", 0.45]]);
    degrade(defs, "liquide-rouge", [[0, "#9d1f2b"], [0.45, "#e2525d"], [1, "#7c1621"]]);
    degrade(defs, "plastique", [[0, "#dfe7ea", 0.55], [0.3, "#ffffff", 0.35], [0.7, "#f4f7f8", 0.2], [1, "#aab7bd", 0.6]]);
  }

  function decor(defs) {
    // Mur, carrelage, paillasse, façade des placards, bois.
    degrade(defs, "mur", [[0, "#d9dcd5"], [1, "#c5c9c1"]], 0, 1);
    degrade(defs, "paillasse", [[0, "#4b5359"], [0.55, "#353b40"], [1, "#2a2f33"]], 0, 1);
    degrade(defs, "bord", [[0, "#5c656c"], [1, "#22262a"]], 0, 1);
    degrade(defs, "facade", [[0, "#8a9497"], [1, "#6c7578"]], 0, 1);
    degrade(defs, "bois", [[0, "#b98a57"], [0.5, "#d9ab74"], [1, "#a17444"]], 0, 1);
    degrade(defs, "bois-face", [[0, "#8d6337"], [1, "#6d4a26"]], 0, 1);
    degrade(defs, "reflet", [[0, "#ffffff", 0], [0.5, "#ffffff", 0.08], [1, "#ffffff", 0]]);
    const motif = L.svg("pattern", { id: "carrelage", width: 48, height: 32, patternUnits: "userSpaceOnUse" }, defs);
    L.svg("rect", { width: 48, height: 32, fill: "#eef0ec" }, motif);
    L.svg("path", { d: "M0 0.5H48M0.5 0V32", stroke: "#c9cdc6", "stroke-width": 1 }, motif);
  }

  function matieres(defs) {
    // Mousse, brique, papier.
    texture_points(defs, "mousse-face", "#f0c64a", "#d9a92c", 7, [[1, 2, 0.9], [4.5, 5, 0.7], [5.5, 1.5, 0.5]]);
    texture_points(defs, "mousse-haut", "#f8d76a", "#e4b844", 7, [[2, 2, 0.8], [5, 5, 0.6]]);
    texture_points(defs, "brique-face", "#b4513a", "#94402c", 9, [[2, 3, 0.9], [6, 7, 0.8], [7, 2, 0.5]]);
    texture_points(defs, "brique-haut", "#c9644a", "#a9503a", 9, [[3, 3, 0.8], [7, 6, 0.6]]);
    degrade(defs, "brique-cote", [[0, "#8e3b28"], [1, "#6f2c1d"]]);
    degrade(defs, "caillou", [[0, "#a4a19a"], [0.5, "#7d7a73"], [1, "#4d4a45"]], 1, 1);
  }

  function rayonnant(defs, id, arrets, cx = 0.35, cy = 0.35) {
    // Ajoute un dégradé radial (sphère éclairée, halo de lampe).
    const g = L.svg("radialGradient", { id, cx, cy, r: 0.75 }, defs);
    for (const [position, couleur, opacite = 1] of arrets) L.svg("stop", { offset: position, "stop-color": couleur, "stop-opacity": opacite }, g);
  }

  function astres(defs) {
    // Lampe-soleil, son halo, globes de la Terre et de la Lune, sphères dorées.
    rayonnant(defs, "soleil", [[0, "#fffbe0"], [0.45, "#ffd23f"], [1, "#e88a0c"]], 0.45, 0.4);
    rayonnant(defs, "halo", [[0, "#fff3b0", 0.55], [0.6, "#ffd23f", 0.12], [1, "#ffd23f", 0]], 0.5, 0.5);
    rayonnant(defs, "terre", [[0, "#8fc3f0"], [0.6, "#2f6db0"], [1, "#163d6b"]]);
    rayonnant(defs, "lune", [[0, "#f2f2ee"], [0.65, "#b5b5ae"], [1, "#6e6e68"]]);
    rayonnant(defs, "laiton-boule", [[0, "#fff1c2"], [0.5, "#d4a640"], [1, "#6d4a0e"]]);
  }

  function marqueurs(defs) {
    // Pointes de flèche : cotes (petites, noires), forces (rouges ou bleues).
    for (const [id, taille, couleur] of [["fleche-cote", 4, "#333"], ["fleche-rouge", 9, "#c0392b"], ["fleche-bleue", 9, "#1f5fa8"]]) {
      const m = L.svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: taille, markerHeight: taille, orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, defs);
      L.svg("path", { d: "M0 0 L10 5 L0 10 Z", fill: couleur }, m);
    }
  }

  L.materiaux = function (dessin) {
    // Crée toutes les matières et ombres dans le dessin du laboratoire.
    const defs = L.svg("defs", {}, dessin);
    metaux(defs);
    verres(defs);
    decor(defs);
    matieres(defs);
    marqueurs(defs);
    astres(defs);

       l'objectif, les étapes cochées au fur et à mesure, la question à laquelle répondre et le tampon de réussite.
Reçoit : l'étage de la scène ; les annonces « missions » ; les réponses de l'élève (choix ou nombre).
Produit : Labo.carnet : creer(), ouvrir(), fermer() ; appelle Labo.missions.repondre() et Labo.missions.aller().
Utilisé par : la page de chaque simulation.
*/
(function (L) {
  const TAILLE = { l: 410, h: 576 };
  const c = { element: null, ouvert: true, pos: { x: 12, y: 32 }, repos: { x: 118, y: 574 }, signature: "" };

  function appliquer() {
    // Place le carnet : ouvert devant l'élève, ou fermé et couché sur la paillasse.
    c.element.style.left = `${c.pos.x}px`;
    c.element.style.top = `${c.pos.y}px`;
    c.element.classList.toggle("ferme", !c.ouvert);
    if (c.ouvert) { c.element.style.transform = "none"; return; }
    const dx = c.repos.x - c.pos.x - TAILLE.l / 2, dy = c.repos.y - c.pos.y - TAILLE.h;
    c.element.style.transform = `translate(${dx}px, ${dy}px) perspective(700px) rotateX(64deg) rotateZ(-4deg) scale(0.36)`;
  }

  function question(zone, q) {
    // Champs de réponse de la question en cours : choix à entourer, ou nombre avec son unité.
    if (q.type === "choix") {
      q.options.forEach((texte, i) => {
        const b = L.ecrire_riche(L.html("button", { type: "button", class: "carnet-choix" }, zone), texte);
        b.addEventListener("click", () => L.missions.repondre(i));
      });
      return;
    }
    const ligne = L.html("div", { class: "carnet-reponse" }, zone);
    const champ = L.html("input", { type: "text", inputmode: "decimal", "aria-label": "Votre réponse", autocomplete: "off" }, ligne);
    L.html("span", { class: "carnet-unite" }, ligne, q.unite || "");
    const valider = L.html("button", { type: "button", class: "carnet-bouton" }, ligne, "Vérifier");
    valider.addEventListener("click", () => L.missions.repondre(champ.value));
    champ.addEventListener("keydown", (e) => { if (e.key === "Enter") L.missions.repondre(champ.value); });
  }

  function marque_pages(page, e) {
    // Un marque-page par mission ; les missions pas encore ouvertes sont grisées.
    const rangee = L.html("div", { class: "carnet-marques" }, page);
    e.missions.forEach((m, i) => {
      const b = L.html("button", { type: "button", class: "carnet-marque" + (m.accomplie ? " accomplie" : "") }, rangee, `Mission ${i + 1}`);
      b.setAttribute("aria-pressed", String(i === e.vue));
      if (i > e.courante) b.disabled = true;
      b.addEventListener("click", () => L.missions.aller(i));
    });
  }

  function etapes(page, m, message) {
    // Liste des étapes : cochées, en cours (avec question et message), ou à venir.
    const liste = L.html("ol", { class: "carnet-etapes" }, page);
    m.etapes.forEach((etape, i) => {
      const etat_etape = i < m.etape || m.accomplie ? "faite" : (i === m.etape ? "courante" : "a-venir");
      const li = L.ecrire_riche(L.html("li", { class: etat_etape }, liste), etape.consigne);
      if (etat_etape !== "courante") return;
      if (etape.question) question(L.html("div", {}, li), etape.question);
      if (message) L.ecrire_riche(L.html("p", { class: "carnet-message " + (message.juste ? "juste" : "faux"), role: "status" }, li), message.texte);
      else if (etape.aide_geste) L.ecrire_riche(L.html("p", { class: "carnet-astuce" }, li), etape.aide_geste);
    });
  }

  function fin_de_mission(page, e) {
    // Tampon « Mission accomplie » et passage à la paillasse suivante.
    L.html("div", { class: "carnet-tampon" }, page, "Mission accomplie");
    const m = e.missions[e.vue];
    if (m.conclusion) L.ecrire_riche(L.html("p", { class: "carnet-conclusion" }, page), m.conclusion);
    if (e.vue + 1 < e.missions.length) {
      const suite = L.html("button", { type: "button", class: "carnet-bouton" }, page, `Passer à la mission ${e.vue + 2}`);
      suite.addEventListener("click", () => L.missions.aller(e.vue + 1));
    } else if (e.missions.every((x) => x.accomplie)) {
      L.html("p", { class: "carnet-conclusion" }, page, "Toutes les missions sont accomplies. Vous pouvez revenir au cours.");
    }
  }

  function ecrire(e) {
    // Réécrit la page du carnet si l'état des missions a changé (sans effacer une réponse en cours de saisie).
    const m = e.missions[e.vue];
    const message = e.messages[m.id];
    const signature = JSON.stringify([e.vue, e.courante, m.etape, m.accomplie, message, e.missions.map((x) => x.accomplie)]);
    if (signature === c.signature) return;
    c.signature = signature;
    c.page.replaceChildren();
    marque_pages(c.page, e);
    L.html("h2", { class: "carnet-titre" }, c.page, `Mission ${e.vue + 1} — ${m.titre}`);
    L.ecrire_riche(L.html("p", { class: "carnet-objectif" }, c.page), m.objectif);
    if (m.donnees) {
      const fiche = L.html("div", { class: "carnet-donnees" }, c.page);
      for (const ligne of m.donnees) L.ecrire_riche(L.html("p", {}, fiche), ligne);
    }
    etapes(c.page, m, message);
    if (m.accomplie) fin_de_mission(c.page, e);
  }

  L.carnet = {
    creer(etage, repos = null) {
      // Construit le carnet (couverture, spirale, page) et le rend mobile ; repos : où il est posé, fermé.
      if (repos) c.repos = repos;
      c.element = L.html("section", { class: "carnet", "aria-label": "Carnet de laboratoire" }, etage);
      L.html("div", { class: "carnet-spirale" }, c.element);
      c.page = L.html("div", { class: "carnet-page" }, c.element);
      const fermer = L.html("button", { type: "button", class: "carnet-fermer" }, c.element, "Poser le carnet");
      fermer.addEventListener("click", () => L.carnet.fermer());
      L.html("div", { class: "carnet-couverture" }, c.element, "Carnet de laboratoire");
      L.glissable(c.element, {
        debut: (e) => (!c.ouvert || e.target.classList.contains("carnet-spirale") ? { ...c.pos } : null),
        deplacer: (p) => { if (c.ouvert) { c.pos = { x: Math.max(-200, Math.min(800, p.x)), y: Math.max(-300, Math.min(300, p.y)) }; appliquer(); } },
        toucher: () => { if (!c.ouvert) L.carnet.ouvrir(); },
      });
      L.ecouter("missions", ecrire);
      appliquer();
    },
    ouvrir() {
      // Ouvre le carnet devant l'élève.
      c.ouvert = true;
      c.element.parentNode.append(c.element);
      appliquer();
    },
    fermer() {
      // Referme le carnet et le repose sur la paillasse.
      c.ouvert = false;
      appliquer();
    },
  };
})(window.Labo);
</script>
  <script>
/*
Rôle : moteur des missions du laboratoire : étape en cours, vérification automatique (gestes, tableur, courbe),
       questions du carnet, passage d'une paillasse à l'autre, messages envoyés à la page du professeur.
Reçoit : la définition des missions (titre, objectif, paillasse, entêtes du tableur, étapes) et le groupe caméra.
Produit : Labo.missions : demarrer(), noter(cle, valeur), repondre(valeur), aller(numero), etat() ;
         annonce « missions » à chaque changement ; postMessage { source: "laboratoire", type, ... } au parent.
Utilisé par : la page de chaque simulation, carnet.js, tablette.js.
*/
(function (L) {
  const etat = { labo: null, missions: [], courante: 0, vue: 0, faits: {}, courbes: {}, messages: {}, debut: {} };
  let camera = null;

  function prevenir_parent(type, donnees = {}) {
    // Envoie un événement à la page qui contient la simulation (journal de recherche).
    if (window.parent === window) return;
    window.parent.postMessage({ source: "laboratoire", laboratoire: etat.labo.id, type, ...donnees }, "*");
  }

  function mission(numero = etat.vue) { return etat.missions[numero]; }

  function contexte(m) {
    // Ce qu'une étape peut vérifier : les faits notés par la paillasse, la feuille et la courbe de la mission.
    return { faits: etat.faits, feuille: L.tablette.feuille(m.id), courbe: etat.courbes[m.id] || { n: 0 } };
  }

  function terminer_mission(m, numero) {
    // La dernière étape est réussie : la mission est accomplie, la suivante s'ouvre.
    m.accomplie = true;
    prevenir_parent("mission_terminee", { mission: m.id, duree_s: Math.round((performance.now() - etat.debut[m.id]) / 1000) });
    if (numero === etat.courante && numero + 1 < etat.missions.length) etat.courante = numero + 1;
    if (etat.missions.every((x) => x.accomplie)) prevenir_parent("laboratoire_termine");
  }

  function avancer(m, numero) {
    // Passe à l'étape suivante de la mission ; termine la mission après la dernière.
    prevenir_parent("etape_reussie", { mission: m.id, etape: m.etape + 1 });
    m.etape += 1;
    etat.messages[m.id] = null;
    if (m.etape >= m.etapes.length) terminer_mission(m, numero);
  }

  function verifier() {
    // Vérifie l'étape en cours de chaque mission ouverte, tant que les étapes automatiques sont réussies.
    etat.missions.forEach((m, numero) => {
      if (numero > etat.courante) return;
      while (!m.accomplie && m.etapes[m.etape].verifier) {
        const resultat = m.etapes[m.etape].verifier(contexte(m));
        if (resultat !== true) { etat.messages[m.id] = typeof resultat === "string" ? { texte: resultat, juste: false } : etat.messages[m.id]; break; }
        avancer(m, numero);
      }
    });
    L.annoncer("missions", L.missions.etat());
  }

  function deplacer_camera(numero) {
    // Glisse la vue jusqu'à la paillasse de la mission (on « marche » vers elle).
    const depart = Number(camera.dataset.x || 0), arrivee = -L.LARGEUR * mission(numero).paillasse;
    camera.dataset.x = arrivee;
    L.animer(0.9, (t) => {
      const k = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      camera.setAttribute("transform", `translate(${depart + (arrivee - depart) * k} 0)`);
    });
  }

  L.missions = {
    demarrer(labo, groupe_camera) {
      // Prépare les missions et place la vue sur la première paillasse.
      etat.labo = labo;
      camera = groupe_camera;
      etat.missions = labo.missions.map((m) => ({ ...m, etape: 0, accomplie: false }));
      etat.debut[etat.missions[0].id] = performance.now();
      L.ecouter("tableur", verifier);
      L.ecouter("courbe", (c) => { etat.courbes[mission().id] = c; verifier(); });
      prevenir_parent("laboratoire_ouvert");
      verifier();
    },
    noter(cle, valeur) {
      // Enregistre un fait observé sur une paillasse (masse accrochée, face posée...) puis revérifie.
      etat.faits[cle] = valeur;
      verifier();
    },
    repondre(valeur) {
      // Corrige la réponse donnée dans le carnet à la question de l'étape en cours.
      const m = mission();
      const q = m.etapes[m.etape]?.question;
      if (!q || m.accomplie) return;
      const attendu = typeof q.attendu === "function" ? q.attendu(etat.faits) : q.attendu;
      const tolerance = q.tolerance_relative ? q.tolerance_relative * Math.abs(attendu) : q.tolerance;
      const juste = q.type === "choix" ? valeur === q.bonne : L.proche(L.lire_nombre(valeur), attendu, tolerance);
      prevenir_parent("reponse", { mission: m.id, etape: m.etape + 1, reponse: String(valeur), juste });
      if (juste) avancer(m, etat.vue);
      etat.messages[m.id] = { texte: juste ? q.bravo || "Exact." : q.aide, juste };
      verifier();
    },
    aller(numero) {
      // Ouvre une mission déjà accessible et va à sa paillasse.
      if (numero > etat.courante) return;
      etat.vue = numero;
      etat.debut[mission(numero).id] ??= performance.now();
      deplacer_camera(numero);
      L.annoncer("missions", L.missions.etat());
    },
    etat() {
      // Résumé pour le carnet, la tablette et les pense-bêtes.
      return { missions: etat.missions, courante: etat.courante, vue: etat.vue, messages: etat.messages };
    },
  };
})(window.Labo);
</script>
  <script>
/*
Rôle : démarrer une simulation de laboratoire : scène, matières, paillasses, tablette, carnet, missions ;
       le pense-bête de chaque paillasse montre l'étape en cours de sa mission.
Reçoit : la définition de la simulation : { id, titre, decor ("aucun" : pas de paillasse), repos_carnet et repos_tablette (facultatifs),
         paillasses: [fabrique, ...], missions: [...] }.
         Chaque fabrique reçoit le groupe SVG de sa paillasse et renvoie { pense_bete }.
Produit : Labo.demarrer(simulation) : le laboratoire prêt à manipuler.
Utilisé par : le fichier « simulation.js » de chaque simulation (dernier script chargé).
*/
(function (L) {
  function pense_betes(postes) {
    // Écrit sur le pense-bête de chaque paillasse l'étape en cours de sa mission (la dernière mission ouverte).
    L.ecouter("missions", (e) => {
      e.missions.forEach((m, i) => {
        const feuille = postes[m.paillasse]?.pense_bete;
        const suivante = e.missions.slice(i + 1).some((x, j) => x.paillasse === m.paillasse && i + 1 + j <= e.courante);
        if (!feuille || i > e.courante || suivante) return;
        if (m.accomplie) return feuille.ecrire("Mission accomplie", m.conclusion_courte || "Ouvrez le carnet pour la suite.");
        const etape = m.etapes[m.etape];
        feuille.ecrire(`Étape ${m.etape + 1} sur ${m.etapes.length}`, etape.court || etape.consigne);
      });
    });
  }

  function construire(simulation) {
    // Construit tout le laboratoire, paillasse par paillasse.
    const etage = document.getElementById("etage");
    L.scene.initialiser(document.getElementById("ecran"), etage);
    const dessin = L.svg("svg", { id: "labo", viewBox: `0 0 ${L.LARGEUR} ${L.HAUTEUR}`, role: "img", "aria-label": simulation.titre });
    etage.prepend(dessin);
    L.materiaux(dessin);
    const camera = L.svg("g", {}, dessin);
    const cadre = L.svg("clipPath", { id: "cadre-paillasse" }, dessin.querySelector("defs"));
    L.svg("rect", { width: L.LARGEUR, height: L.HAUTEUR }, cadre);
    const postes = simulation.paillasses.map((fabrique, numero) => {
      const g = L.svg("g", { transform: `translate(${numero * L.LARGEUR} 0)`, "clip-path": "url(#cadre-paillasse)" }, camera);
      if (simulation.decor !== "aucun") L.decor.paillasse(g, numero);
      return fabrique(g);
    });
    L.tablette.creer(etage, simulation.missions, simulation.repos_tablette);
    L.carnet.creer(etage, simulation.repos_carnet);
    pense_betes(postes);
    L.missions.demarrer(simulation, camera);
  }

  L.demarrer = function (simulation) {
    // Lance la construction dès que la page est prête.
    document.title = simulation.titre;
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => construire(simulation));
    else construire(simulation);
  };
})(window.Labo);
</script>
  <script>
/*
Rôle : bouton-poussoir lumineux posé sur un poste (par exemple « Pause / Lecture » du temps qui s'écoule) :
       un appui l'enfonce et change son voyant ; utilisable au doigt, à la souris et au clavier (Entrée, Espace).
Reçoit : le groupe SVG, la position, les deux inscriptions (repos, enfoncé) et la fonction à appeler.
Produit : Labo.bouton_poussoir(parent, x, y, { textes: [repos, enfonce], sur_changement(enfonce) }) -> { regler(enfonce) }.
Utilisé par : les simulations où le temps s'écoule (gravitation, relativité), l'éclateur (eclateur.js).
*/
(function (L) {
  function dessiner(g, textes) {
    // Socle métallique (largeur adaptée à l'inscription), capuchon coloré et son reflet, inscription gravée.
    const largeur = 44 + Math.max(...textes.map((t) => t.length)) * 7.6;
    L.svg("rect", { x: -largeur / 2, y: -17, width: largeur, height: 34, rx: 6, fill: "url(#acier)", stroke: "#1b1e21", filter: "url(#ombre)" }, g);
    return {
      capuchon: L.svg("circle", { cx: -largeur / 2 + 20, cy: 0, r: 11, stroke: "#111", "stroke-width": 1 }, g),
      reflet: L.svg("ellipse", { cx: -largeur / 2 + 17, cy: -4, rx: 5, ry: 3, fill: "#fff", opacity: 0.45 }, g),
      texte: L.texte(g, 18, 1, "", { "font-size": 13, "font-weight": 700, fill: "#e8edf1" }),
    };
  }

  L.bouton_poussoir = function (parent, x, y, { textes, sur_changement }) {
    // Construit le bouton et le rend utilisable au doigt, à la souris et au clavier.
    const g = L.svg("g", { transform: `translate(${x} ${y})`, class: "bouton-poussoir", role: "button", tabindex: 0 }, parent);
    const { capuchon, reflet, texte } = dessiner(g, textes), etat = { enfonce: false };

    function regler(enfonce) {
      // Affiche l'état : en marche (capuchon vert, « Pause ») ou arrêté (capuchon orange enfoncé, « Lecture »).
      etat.enfonce = enfonce;
      capuchon.setAttribute("fill", enfonce ? "#f2a33a" : "#3fbf6a");
      capuchon.setAttribute("r", enfonce ? 10 : 11);
      reflet.setAttribute("opacity", enfonce ? 0.25 : 0.45);
      texte.textContent = textes[enfonce ? 1 : 0];
      g.setAttribute("aria-pressed", String(enfonce));
      g.setAttribute("aria-label", textes[enfonce ? 1 : 0]);
    }

    const appuyer = () => { regler(!etat.enfonce); sur_changement(etat.enfonce); };
    g.addEventListener("pointerdown", (e) => { e.labo_pris = true; });
    g.addEventListener("dblclick", (e) => { e.labo_pris = true; });
    g.addEventListener("click", appuyer);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); appuyer(); } });
    regler(false);
    return { regler };
  };
})(window.Labo);
</script>
  <script>
/*
Rôle : calcule les potentiels et les courants d'un circuit en courant continu (méthode des nœuds). Chaque dipôle est
       vu comme une conductance g en parallèle avec une source de courant j : i(a→b) = g·(Va − Vb) + j.
       Un générateur (E, r) est donc g = 1/r, j = E/r de sa borne − vers sa borne +. Un dipôle non linéaire
       (DEL, lampe, diode) est remplacé par sa tangente au point de fonctionnement : on recalcule jusqu'à stabilité.
Reçoit : le nombre de nœuds et la liste des dipôles { a, b (numéros de nœuds), g (S), j (A), ctrl (facultatif : sources
         commandées [{ c, d, g }] qui ajoutent g·(Vc − Vd) au courant de a vers b), ajuster(u, i, V) (facultatif : renvoie
         vrai si le dipôle change d'état et met à jour g, j et ctrl) }.
Produit : Labo.resoudre_circuit(n, dipoles) -> { potentiels: [V], courants: [A] (de a vers b, un par dipôle) } ;
          Labo.dipole_non_lineaire(a, b, courant(u), pas_max) -> dipôle à caractéristique quelconque.
Utilisé par : circuit.js.
*/
(function (L) {
  const FUITE = 1e-9, TOURS = 60;

  function eliminer(A, B) {
    // Résout A·x = B (pivot de Gauss partiel) ; A et B sont modifiés.
    const n = B.length;
    for (let k = 0; k < n; k++) {
      let p = k;
      for (let i = k + 1; i < n; i++) if (Math.abs(A[i][k]) > Math.abs(A[p][k])) p = i;
      [A[k], A[p]] = [A[p], A[k]];
      [B[k], B[p]] = [B[p], B[k]];
      for (let i = k + 1; i < n; i++) {
        const f = A[i][k] / A[k][k];
        if (!f) continue;
        for (let c = k; c < n; c++) A[i][c] -= f * A[k][c];
        B[i] -= f * B[k];
      }
    }
    const x = new Array(n).fill(0);
    for (let k = n - 1; k >= 0; k--) {
      let s = B[k];
      for (let c = k + 1; c < n; c++) s -= A[k][c] * x[c];
      x[k] = s / A[k][k];
    }
    return x;
  }

  function une_fois(n, dipoles) {
    // Assemble les équations des nœuds (somme des courants sortants nulle) et les résout.
    const A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, c) => (i === c ? FUITE : 0)));
    const B = new Array(n).fill(0);
    for (const d of dipoles) {
      A[d.a][d.a] += d.g; A[d.b][d.b] += d.g;
      A[d.a][d.b] -= d.g; A[d.b][d.a] -= d.g;
      B[d.a] -= d.j || 0; B[d.b] += d.j || 0;
      for (const k of d.ctrl || []) { A[d.a][k.c] += k.g; A[d.a][k.d] -= k.g; A[d.b][k.c] -= k.g; A[d.b][k.d] += k.g; }
    }
    const V = eliminer(A, B);
    const commande = (d) => (d.ctrl || []).reduce((s, k) => s + k.g * (V[k.c] - V[k.d]), 0);
    return { potentiels: V, courants: dipoles.map((d) => d.g * (V[d.a] - V[d.b]) + (d.j || 0) + commande(d)) };
  }

  L.dipole_non_lineaire = function (a, b, courant, pas_max) {
    // Dipôle de caractéristique i = courant(u) : remplacé par sa tangente au dernier point ; à chaque tour, la tension
    // de ce point se rapproche de la tension calculée, d'au plus pas_max (méthode de Newton amortie).
    const d = { a, b, u0: 0 };
    const tangente = (u) => {
      const h = 1e-5, i = courant(u), g = Math.max(1e-9, (courant(u + h) - courant(u - h)) / (2 * h));
      Object.assign(d, { u0: u, g, j: i - g * u });
    };
    tangente(0);

Rôle : fils de connexion du circuit : l'élève tire un fil depuis une borne et le lâche sur une autre borne ; il tire un fil

       fil est rangé). Les fiches banane s'empilent sur une borne ; le câble pend un peu.

  <script>
/*
Rôle : générateur de tension continue (alimentation de laboratoire) : tension E fixe, petite résistance interne ;

       Un bouton Marche/Arrêt (en marche au départ) ; son cordon secteur est branché dans la prise du mur par une fiche.

    L.svg("rect", { x: x + 10, y: y + 9, width: 84, height: 13, rx: 2, fill: "#2c3e50" }, g);
    L.texte(g, x + 52, y + 16, "GÉNÉRATEUR =", { "font-size": 7.5, fill: "#e6eef4", "font-weight": 700, "letter-spacing": 0.6 });
    L.svg("rect", { x: x + 104, y: y + 6, width: 76, height: 24, rx: 2, fill: "#10251a", stroke: "#071209" }, g);
    const afficheur = L.texte(g, x + 160, y + 19, "", { "text-anchor": "end", "font-size": 15, "font-family": "monospace", "font-weight": 700, fill: "#5cf08a" });
    L.texte(g, x + 171, y + 19, "V", { "font-size": 10, "font-weight": 700, fill: "#5cf08a" });
    const voyant = L.svg("circle", { cx: x + 95, cy: y + 50, r: 4, fill: "#4a1712" }, g);
    L.texte(g, x + 95, y + 62, "LIMIT", { "font-size": 6.5, fill: "#2c3e50", "font-weight": 700 });
    for (let k = 0; k < 6; k++) L.svg("rect", { x: x + 20 + k * 17, y: y + 92, width: 10, height: 3, rx: 1.5, fill: "#3b4a56" }, g);
    L.texte(g, x + 150, y + 38, "+", { "font-size": 13, "font-weight": 700, fill: L.ROUGE_BORNE });

    if (lettres) [[18, lettres[0]], [172, lettres[1]]].forEach(([dx, t]) => L.texte(comp.g, x + dx, y + 58, t, { "font-size": 12, "font-weight": 700, fill: "#1a3d7c" }));

    dipole.ajuster = (u, i) => {

/*
Rôle : petits appareils du circuit, chacun sur son support à deux bornes : lampe à incandescence (elle brille selon la
       puissance reçue), diode électroluminescente avec sa résistance de protection (elle ne laisse passer le courant
       que dans un sens : de sa borne + vers sa borne −), interrupteur à couteau (un toucher l'ouvre ou le ferme).
Reçoit : le circuit (circuit.js) et le réglage de chaque appareil { id, x, y, ... }.
Produit : Labo.lampe(c, { id, x, y, U_n, I_n, etiquette, lettres }) -> { i, u, eclat } ; Labo.support_dipole(...) ; Labo.del(c, { id, x, y }) -> { i, u, allumee } ;
          Labo.interrupteur(c, { id, x, y, lettres }) -> { ferme } ; bornes « 1 » et « 2 » (DEL : « + » et « − »).
Utilisé par : les postes des simulations d'électricité.
*/
(function (L) {
  const L_SUPPORT = 92, P_SUPPORT = 46, SEUIL_DEL = 1.9, R_DEL = 100, GRIS_BORNE = "#4a4f55";

  function support(c, comp, x, y, etiquette, bornes = ["1", "2"], couleurs = [GRIS_BORNE, GRIS_BORNE], lettres = null) {
    // Support en plastique gris, son étiquette sur la face avant, deux bornes (avec leur lettre, si elle est donnée).
    L.boitier(comp.g, x, y, L_SUPPORT, P_SUPPORT, 12, { dessus: "#e3e1da", face: "#a8a59b" });
    L.texte(comp.g, x + L_SUPPORT / 2, y + P_SUPPORT + 4, etiquette, { "font-size": 8, "font-weight": 700, fill: "#2a2a28" });
    c.borne(comp, bornes[0], x + 14, y + 33, couleurs[0]);
    c.borne(comp, bornes[1], x + L_SUPPORT - 14, y + 33, couleurs[1]);
    if (lettres) [5, L_SUPPORT - 5].forEach((dx, k) => L.texte(comp.g, x + dx, y + 14, lettres[k], { "font-size": 11, "font-weight": 700, fill: "#1a3d7c" }));
  }

  L.support_dipole = support;

  function symbole_del(g, cx, cy) {
    // Symbole normalisé de la DEL : triangle (sens passant de + vers −), barre, deux flèches de lumière qui sortent.
    const trait = { stroke: "#222", "stroke-width": 1.3, fill: "none" };
    L.svg("path", { d: `M${cx - 21} ${cy} H${cx - 6} M${cx + 6} ${cy} H${cx + 21} M${cx + 6} ${cy - 7} V${cy + 7}`, ...trait }, g);

    support(c, comp, x, y, `${etiquette ? etiquette + " : " : ""}${String(U_n).replace(".", ",")} V – ${String(I_n).replace(".", ",")} A`, ["1", "2"], [GRIS_BORNE, GRIS_BORNE], lettres);
    const cx = x + L_SUPPORT / 2, R = U_n / I_n;
    L.svg("ellipse", { cx, cy: y + 18, rx: 14, ry: 6, fill: "url(#metal-h)", stroke: "#555" }, comp.g);
    const halo = L.svg("circle", { cx, cy: y - 2, r: 46, fill: "url(#halo)", opacity: 0 }, comp.g);
    const ampoule = L.svg("circle", { cx, cy: y - 2, r: 17, fill: "#ffe9a0", opacity: 0 }, comp.g);
    L.svg("circle", { cx, cy: y - 2, r: 17, fill: "url(#verre)", stroke: "#9fb6be" }, comp.g);
    const filament = L.svg("path", { d: `M${cx - 7} ${y + 6} L${cx - 5} ${y - 4} l2 -3 l2 3 l2 -3 l2 3 l2 -3 L${cx + 7} ${y + 6}`, fill: "none", stroke: "#6b5b45", "stroke-width": 1 }, comp.g);

      const e = Math.pow(comp.eclat, 0.6);
      halo.setAttribute("opacity", Math.min(1, e));
      ampoule.setAttribute("opacity", Math.min(0.9, e));
      filament.setAttribute("stroke", comp.eclat > 0.03 ? `rgb(255 ${Math.round(120 + 120 * Math.min(1, e))} ${Math.round(60 * e)})` : "#6b5b45");

  L.del = function (c, { id = "del", x, y }) {
    // DEL rouge (seuil 1,9 V, résistance de protection 100 Ω) ; bloquée dans le sens inverse.
    const comp = { id, i: 0, allumee: false, g: L.svg("g", { class: `del del-${id}` }, c.calque_composants) };
    support(c, comp, x, y, "DEL + 100 Ω", ["+", "−"], [L.ROUGE_BORNE, L.NOIR_BORNE]);
    const cx = x + L_SUPPORT / 2;
    L.texte(comp.g, x + 14, y + 13, "+", { "font-size": 12, "font-weight": 700, fill: L.ROUGE_BORNE });
    symbole_del(comp.g, cx, y + 33);
    const halo = L.svg("circle", { cx, cy: y + 9, r: 24, fill: "#ff3b30", opacity: 0, filter: "url(#flou)" }, comp.g);
    const dome = L.svg("circle", { cx, cy: y + 9, r: 6, fill: "#8e1b14", stroke: "#5a0f0a" }, comp.g);
    L.svg("circle", { cx: cx - 2, cy: y + 7, r: 1.8, fill: "#fff", opacity: 0.6 }, comp.g);
    const dipole = { a: "+", b: "−", g: 1e-9, j: 0, passante: false };

  L.interrupteur = function (c, { id = "interrupteur", x, y, lettres = null }) {

    const comp = { id, ferme: false, g: L.svg("g", { class: `interrupteur interrupteur-${id}`, role: "button", "aria-label": "Interrupteur" }, c.calque_composants) };
    support(c, comp, x, y, "K", ["1", "2"], [GRIS_BORNE, GRIS_BORNE], lettres);
    const lame = L.svg("g", {}, comp.g), pivot = { x: x + 24, y: y + 18 }, pince = { x: x + 70, y: y + 18 };
    for (const p of [pivot, pince]) L.svg("rect", { x: p.x - 4, y: p.y - 6, width: 8, height: 10, fill: "url(#laiton)" }, comp.g);
    const dessiner = () => {
      lame.replaceChildren();
      const bout = comp.ferme ? { x: pince.x + 6, y: pince.y } : { x: pivot.x + 36, y: pivot.y - 30 };
      L.svg("line", { x1: pivot.x, y1: pivot.y, x2: bout.x, y2: bout.y, stroke: "url(#laiton)", "stroke-width": 4, "stroke-linecap": "round" }, lame);
      L.svg("circle", { cx: bout.x + (comp.ferme ? 4 : 2), cy: bout.y - (comp.ferme ? 0 : 3), r: 6, fill: "#b71c1c", stroke: "#5e0d0d" }, lame);

    comp.g.append(lame);

    L.glissable(comp.g, { soulever: false, debut: () => ({ x, y }), toucher: () => { comp.ferme = !comp.ferme; dessiner(); c.calculer(); } });
    comp.dipoles = () => (comp.ferme ? [{ a: "1", b: "2", g: 1000, j: 0 }] : []);
    return c.ajouter(comp);
  };

  <script>
/*
Rôle : résistances du circuit avec leur vrai code des couleurs (2 chiffres, multiplicateur, tolérance or 5 %) : sur un
       support, ou en plaquette (plusieurs résistances soudées entre des bornes nommées A, B, C, D...) ; planche de fils
       résistants (R = ρ·l/S).
Reçoit : le circuit (circuit.js) et le réglage { id, x, y, R: [valeurs en Ω], lettres: [noms des bornes] }.
Produit : Labo.code_couleurs(R) -> [4 couleurs] ; Labo.plaquette_resistances(c, reglage) -> composant { i: [courants] } ;
          Labo.resistance(c, { id, x, y, R, R_reelle, nom, lettres }) (sur support) ;
          Labo.fils_resistants(c, { x, y, fils: [{ nom, matiere, rho, l (m), S (mm²) }] }) (bornes « <nom>1 », « <nom>2 »).
Utilisé par : les postes des simulations de tension.

(function (L) {
  const COULEURS = ["#111111", "#7b4a1e", "#d32f2f", "#f57c00", "#fdd835", "#2e7d32", "#1565c0", "#7b1fa2", "#8d8d8d", "#f5f5f5"];

    L.svg("rect", { x: m - 24, y: y - 7, width: 48, height: 14, rx: 6, fill: "#e8d3a6", stroke: "#a68b55" }, g);
    L.code_couleurs(R).forEach((couleur, k) => L.svg("rect", { x: m - 17 + k * 8 + (k === 3 ? 6 : 0), y: y - 7, width: 4, height: 14, fill: couleur }, g));
    L.svg("rect", { x: m - 22, y: y - 5, width: 44, height: 3, rx: 1.5, fill: "#fff", opacity: 0.35 }, g);
    if (nom) L.texte(g, m, y + 16, `${nom} = ${R} Ω`, { "font-size": 8.5, "font-weight": 700, fill: "#f4f1e0" });
  }

  L.plaquette_resistances = function (c, { id = "plaquette", x, y, R = [100, 220, 330], lettres = ["A", "B", "C", "D"] }) {

    const largeur = ECART * R.length + 40;
    L.boitier(comp.g, x, y, largeur, 64, 8, { dessus: "#2f6b45", face: "#1f4a30" });
    L.svg("rect", { x: x + 6, y: y + 6, width: largeur - 12, height: 52, rx: 3, fill: "none", stroke: "#c9b26a", "stroke-width": 0.8, opacity: 0.6 }, comp.g);
    const bx = (k) => x + 20 + k * ECART;
    lettres.forEach((t, k) => L.svg("line", { x1: bx(k), y1: y + 24, x2: bx(k), y2: y + 44, stroke: "#c98a3a", "stroke-width": 3 }, comp.g));
    R.forEach((r, k) => resistance(comp.g, bx(k), bx(k + 1), y + 24, r, `R${k + 1}`));
    lettres.forEach((t, k) => {
      L.texte(comp.g, bx(k), y + 9, t, { "font-size": 11, "font-weight": 700, fill: "#f4f1e0" });

      L.svg("line", { x1: x + 30, y1: yy, x2, y2: yy, stroke: f.matiere === "cuivre" ? "#c8742e" : "#b9bcc0", "stroke-width": f.S > 0.07 ? 2.2 : 1.3 }, comp.g);
      L.texte(comp.g, x + 30, yy - 14, `${f.nom} : ${f.matiere}, l = ${String(f.l.toFixed(2)).replace(".", ",")} m, S = ${String(f.S.toFixed(2)).replace(".", ",")} mm²`, { "text-anchor": "start", "font-size": 8.5, "font-weight": 700, fill: "#3b2a16" });
      c.borne(comp, `${f.nom}1`, x + 22, yy + 4, "#c9a227");

       réelle ne représente que 1/k seconde du circuit (phénomènes de quelques millisecondes, rendus visibles).

       un toucher ouvre le document en grand au centre de la scène ; un second toucher le referme.

         et le nom du fait à noter ; un document peut avoir un dessin(g, x, y, k) (illustration à droite du texte, échelle k).
Produit : Labo.documents_mur(g, documents, fait) ; fait « <fait> » = [numéros des documents lus].

      L.svg("rect", { x: x + 8 + k * pas, y: y - taille, width: pas - 24, height: taille * 2.6, rx: 3, fill: "#e8f0f7", stroke: "#8fb0cf" }, g);
