<!doctype html>
<!--
Rôle : page du questionnaire de départ (QCM diagnostique), une question à la fois.
Reçoit : le questionnaire du serveur (sans les bonnes réponses) et le pseudonyme de la séance.
Produit : pour chaque question, le choix, la justification, la certitude et le temps de réponse ; envoyés à la fin.
Utilisé par : l'élève, après l'accueil.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire · Professeur IA</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/formulaire.css">
  <link rel="stylesheet" href="css/parcours.css">
  <script type="module" src="js/interaction/qcm.js"></script>
</head>
<body>
  <header class="bandeau">
    <span class="bandeau-nom">Professeur IA</span>
    <span class="bandeau-matiere">Physique-chimie</span>
  </header>

  <main class="page">
    <ol class="parcours" aria-label="Étapes">
      <li>1. Accueil</li>
      <li aria-current="step">2. Questionnaire</li>
      <li>3. Cours au tableau</li>
    </ol>

    <h1 id="titre">Questionnaire</h1>
    <p id="consigne" class="chapeau"></p>
    <p id="avancement" class="avancement" aria-live="polite"></p>
    <div id="question"></div>
    <p id="message" class="message" role="status"></p>
  </main>
</body>
</html>
