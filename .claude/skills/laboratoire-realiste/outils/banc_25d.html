<!doctype html>
<!--
Rôle : banc d'essai de la PROPOSITION 2,5D : voir et manipuler les règles du guide (vue, lumière, ombres, liquides),
       à part, sans toucher aux laboratoires (fichiers de la proposition : proposition_25d/ ; le reste est lu, pas modifié).
Reçoit : les curseurs de l'utilisateur (rapport des ovales k, volume du bécher, angle de l'erlenmeyer, bouton « Secouer »).
Produit : la scène 1024 × 640 ; window.banc pour le test automatique (test_25d.js).
Utilisé par : l'enseignant (ouvrir ce fichier dans un navigateur) et outils/test_25d.js.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Banc d'essai 2,5D</title>
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; background: #f6f4ee; color: #1c201e; }
    svg { display: block; width: 100%; max-width: 1024px; height: auto; }
    .reglages { display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 14px; align-items: center; }
    label { display: flex; gap: 8px; align-items: center; }
    button { font: inherit; padding: 6px 14px; }
  </style>
</head>
<body>
  <div class="reglages">
    <label>Hauteur du regard k <input id="k" type="range" min="0.12" max="0.4" step="0.01" value="0.26"><output id="vk">0,26</output></label>
    <label>Volume du bécher <input id="v" type="range" min="0" max="240" step="5" value="120"><output id="vv">120 mL</output></label>
    <label>Angle de l'erlenmeyer <input id="a" type="range" min="0" max="80" step="1" value="0"><output id="va">0°</output></label>
    <button id="secouer" type="button">Secouer l'éprouvette</button>
  </div>
  <svg id="scene" viewBox="0 0 1024 640" role="img" aria-label="Banc d'essai 2,5D"></svg>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/base.js"></script>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/ambiance.js"></script>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/materiaux.js"></script>
  <script src="proposition_25d/vue_25d.js"></script>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/liquide_geometrie.js"></script>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/liquide_contenu.js"></script>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/verrerie_profils.js"></script>
  <script src="proposition_25d/verrerie_rendu_25d.js"></script>
  <script src="../../../../prof-ia/contenu/ressources/laboratoires/commun/recipient_physique.js"></script>
  <script src="banc_25d.js"></script>
  <script>
    const fr = (x) => String(x).replace(".", ",");
    document.getElementById("k").oninput = (e) => { banc.regler({ k: +e.target.value }); document.getElementById("vk").value = fr(e.target.value); };
    document.getElementById("v").oninput = (e) => { banc.regler({ V: +e.target.value }); document.getElementById("vv").value = `${e.target.value} mL`; };
    document.getElementById("a").oninput = (e) => { banc.regler({ angle: +e.target.value }); document.getElementById("va").value = `${e.target.value}°`; };
    document.getElementById("secouer").onclick = () => banc.secouer();
  </script>
</body>
</html>
